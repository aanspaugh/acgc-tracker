<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AC: GameCube — Collection Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green-dark:    #2e6b28;
      --green-light:   #82c97c;
      --cream:         #f7f2e3;
      --card-bg:       #ffffff;
      --text-main:     #2a3828;
      --text-muted:    #637060;
      --text-faint:    #b0bdb0;
      --found-color:   #2563eb;
      --found-light:   #dbeafe;
      --donated-color: #b45309;
      --donated-light: #fef3c7;
      --shadow-card:   0 2px 10px rgba(0,0,0,0.09);
      --radius-card:   14px;
      --radius-sm:     8px;
    }
    html { font-size: 18px; overflow-x: hidden; }
    body {
      background: var(--cream); color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; padding-bottom: 2rem; overflow-x: hidden;
    }
    /* Header */
    .site-header {
      position: sticky; top: 0; z-index: 100;
      background: var(--green-dark);
      box-shadow: 0 3px 14px rgba(0,0,0,0.28);
    }
    .header-top {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.55rem 1rem 0.45rem; gap: 0.75rem;
    }
    .header-title   { font-size: 1rem; font-weight: 800; color: #d8f5d8; white-space: nowrap; }
    .header-subtitle{ font-size: 0.72rem; color: #96c896; margin-top: 0.05rem; }
    .header-stats   { display: flex; gap: 0.5rem; flex-shrink: 1; flex-wrap: wrap; justify-content: flex-end; min-width: 0; overflow: hidden; }
    @media (max-width: 559px) { .header-stats { display: none; } }
    .stat-chip {
      background: rgba(255,255,255,0.13); border-radius: 20px;
      padding: 0.22rem 0.7rem; font-size: 0.74rem; font-weight: 600; color: #c8f0c8; white-space: nowrap;
    }
    /* Tabs */
    .tab-bar { display: flex; border-top: 1px solid rgba(255,255,255,0.12); }
    .tab-btn {
      flex: 1; padding: 0.58rem 0.5rem; background: none; border: none;
      color: rgba(255,255,255,0.55); font-size: 0.88rem; font-weight: 600;
      cursor: pointer; border-bottom: 3px solid transparent;
      transition: color 0.15s, border-color 0.15s, background 0.15s; line-height: 1;
    }
    .tab-btn:hover  { color: rgba(255,255,255,0.85); background: rgba(255,255,255,0.07); }
    .tab-btn.active { color: #fff; border-bottom-color: var(--green-light); }
    /* Tab sections */
    .tab-section         { display: none; }
    .tab-section.active  { display: block; }
    /* Card grid */
    .card-grid {
      display: grid; grid-template-columns: 1fr;
      gap: 0.75rem; padding: 1rem; max-width: 1400px; margin: 0 auto;
    }
    @media (min-width: 560px)  { .card-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 860px)  { .card-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1160px) { .card-grid { grid-template-columns: repeat(4, 1fr); } }
    /* Item card */
    .item-card {
      background: var(--card-bg); border-radius: var(--radius-card);
      box-shadow: var(--shadow-card); padding: 1rem;
      display: flex; flex-direction: column; gap: 0.65rem;
      border: 2px solid transparent; cursor: pointer;
      transition: border-color 0.2s, opacity 0.2s, background 0.2s;
    }
    .item-card:active { opacity: 0.85; }
    .item-card.is-found:not(.is-donated) { border-color: #bfdbfe; }
    .item-card.is-donated { border-color: #fcd34d; background: #fffef8; opacity: 0.72; }
    .card-top { display: flex; gap: 0.7rem; align-items: flex-start; }
    .card-img-wrap {
      width: 62px; height: 62px; flex-shrink: 0; border-radius: var(--radius-sm);
      background: var(--cream); display: flex; align-items: center; justify-content: center;
    }
    .card-img { width: 54px; height: 54px; object-fit: contain; image-rendering: pixelated; }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-weight: 700; font-size: 1rem; line-height: 1.25; color: var(--text-main); }
    .card-num  { font-size: 0.7rem; font-weight: 500; color: var(--text-faint); margin-right: 0.3em; }
    .card-meta { margin-top: 0.3rem; display: flex; flex-direction: column; gap: 0.15rem; }
    .meta-row  { font-size: 0.8rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .shadow-dots { color: var(--green-dark); letter-spacing: -0.05em; margin-right: 0.25em; }
    /* Checkboxes */
    .card-checks { display: flex; gap: 0.5rem; margin-top: 0.1rem; }
    .check-pill {
      flex: 1; display: flex; align-items: center; justify-content: center;
      gap: 0.4rem; padding: 0.55rem 0.5rem; border-radius: var(--radius-sm);
      border: 2px solid #e2e8e2; cursor: pointer; user-select: none;
      font-size: 0.85rem; font-weight: 600; color: var(--text-muted); background: #fafafa;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      -webkit-tap-highlight-color: transparent; min-height: 48px;
    }
    .check-pill input { width: 20px; height: 20px; cursor: pointer; flex-shrink: 0; margin: 0; }
    .check-pill.found-pill  input { accent-color: var(--found-color);   }
    .check-pill.donated-pill input { accent-color: var(--donated-color); }
    .check-pill.found-pill.is-checked   { border-color: var(--found-color);   background: var(--found-light);   color: var(--found-color);   }
    .check-pill.donated-pill.is-checked { border-color: var(--donated-color); background: var(--donated-light); color: var(--donated-color); }
    /* Fossil groups */
    .fossil-section { max-width: 1400px; margin: 0 auto; padding: 0.75rem 1rem 0; }
    .fossil-group   { margin-bottom: 1.5rem; }
    .group-header   {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem; padding: 0.45rem 0.2rem 0.55rem;
      border-bottom: 2px solid var(--cream); margin-bottom: 0.6rem;
    }
    .group-name  { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .group-badge {
      font-size: 0.78rem; font-weight: 700; padding: 0.2rem 0.65rem;
      border-radius: 20px; background: #f0f0f0; color: var(--text-muted);
      white-space: nowrap; transition: background 0.2s, color 0.2s;
    }
    .group-badge.complete { background: #dcfce7; color: #15803d; }
    .fossil-group .card-grid { padding: 0; }
    .fossil-group .item-card { gap: 0.45rem; }

    /* Availability states */
    .avail-dot   { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
                   background: #22c55e; margin-right: 0.35em; vertical-align: middle; flex-shrink: 0; }
    .avail-clock { font-size: 0.85em; margin-right: 0.25em; }
    .card-avail  { display: flex; align-items: center; font-size: 0.72rem; font-weight: 600;
                   color: #15803d; margin-bottom: 0.1rem; }
    .card-avail.month { color: var(--text-muted); }
    .item-card.unavail { opacity: 0.38; }
    .item-card.unavail .card-name { color: var(--text-muted); }

    /* Date/time row */
    .header-dt {
      display: flex; align-items: center; gap: 0.4rem; flex-wrap: nowrap;
      padding: 0.2rem 0.75rem; border-top: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.12);
    }
    .dt-label { font-size: 0.7rem; color: #96c896; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
    .dt-input {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 6px; color: #e8f5e8; font-size: 0.7rem; padding: 0.15rem 0.35rem;
      cursor: pointer; outline: none; font-family: inherit; min-width: 0; flex-shrink: 1;
    }
    .dt-input::-webkit-calendar-picker-indicator { filter: invert(0.75); cursor: pointer; }
    .dt-now-btn {
      background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 6px; color: #d8f5d8; font-size: 0.68rem; font-weight: 700;
      padding: 0.15rem 0.5rem; cursor: pointer; white-space: nowrap; flex-shrink: 0;
      transition: background 0.15s;
    }
    .dt-now-btn:hover { background: rgba(255,255,255,0.28); }

    /* Filter buttons */
    .header-filters {
      display: flex; gap: 0.4rem; flex-wrap: nowrap;
      padding: 0.2rem 0.75rem 0.3rem; align-items: center;
    }
    .filter-btn {
      background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.2);
      border-radius: 20px; color: rgba(255,255,255,0.7); font-size: 0.7rem; font-weight: 700;
      padding: 0.2rem 0.6rem; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .filter-btn:hover { background: rgba(255,255,255,0.22); color: #fff; }
    .filter-btn.active { background: #22c55e; border-color: #22c55e; color: #fff; }
    .filter-btn.active.hide-unavail { background: #f59e0b; border-color: #f59e0b; }

    /* Progress bars */
    .header-progress {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.2rem 0.75rem 0.3rem;
      border-top: 1px solid rgba(255,255,255,0.10);
      background: rgba(0,0,0,0.10);
    }
    .progress-item { display: flex; align-items: center; gap: 0.4rem; flex: 1; min-width: 110px; }
    .progress-label { font-size: 0.7rem; font-weight: 700; color: #96c896; white-space: nowrap; min-width: 50px; }
    .progress-track {
      flex: 1; height: 7px; background: rgba(255,255,255,0.15);
      border-radius: 4px; overflow: hidden; min-width: 36px;
    }
    .progress-fill {
      height: 100%; width: 0%; border-radius: 4px;
      transition: width 0.35s ease; background: #22c55e;
    }
    .progress-fill.fish    { background: #38bdf8; }
    .progress-fill.fossils { background: #fb923c; }
    .progress-fill.total   { background: #a78bfa; }
    .progress-count { font-size: 0.67rem; font-weight: 700; color: #c8f0c8; white-space: nowrap; min-width: 26px; text-align: right; }
    /* Search + sort controls */
    .header-controls {
      display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
      padding: 0.28rem 1rem 0.38rem;
      border-top: 1px solid rgba(255,255,255,0.10);
    }
    .search-wrap { display: flex; align-items: center; flex: 1; min-width: 130px; gap: 0.32rem; }
    .search-icon { font-size: 0.82rem; }
    .search-input {
      flex: 1; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 6px; color: #e8f5e8; font-size: 0.8rem; padding: 0.24rem 0.52rem;
      outline: none; font-family: inherit; min-width: 0;
    }
    .search-input::placeholder { color: rgba(200,240,200,0.45); }
    .search-input:focus { border-color: rgba(255,255,255,0.45); background: rgba(255,255,255,0.18); }
    .sort-wrap { display: flex; align-items: center; gap: 0.32rem; flex-shrink: 0; }
    .sort-label { font-size: 0.72rem; color: #96c896; font-weight: 600; white-space: nowrap; }
    .sort-select {
      background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 6px; color: #e8f5e8; font-size: 0.78rem; padding: 0.22rem 0.5rem;
      outline: none; font-family: inherit; cursor: pointer;
    }
    .sort-select option { background: #2e6b28; color: #e8f5e8; }
    /* Completion celebration */
    #celebrationOverlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s;
    }
    #celebrationOverlay.open { opacity: 1; pointer-events: auto; }
    .celebration-confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .celebration-card {
      background: white; border-radius: 24px;
      padding: 2rem 1.8rem 1.6rem;
      text-align: center; max-width: 310px; width: 90%;
      position: relative; z-index: 1;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    #celebrationOverlay.open .celebration-card {
      animation: celebPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes celebPop {
      from { transform: scale(0.6); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .celebration-emoji { font-size: 3.8rem; margin-bottom: 0.5rem; line-height: 1; }
    .celebration-title {
      font-size: 1.55rem; font-weight: 800; color: var(--green-dark);
      margin-bottom: 0.45rem; line-height: 1.2;
    }
    .celebration-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 1.3rem; line-height: 1.5; }
    .celebration-btn {
      background: var(--green-dark); color: white;
      border: none; border-radius: 24px; padding: 0.7rem 2.2rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background 0.15s; font-family: inherit;
    }
    .celebration-btn:hover { background: #3a8832; }
    .confetti-piece {
      position: absolute; width: 9px; height: 9px; border-radius: 2px;
      animation: confettiFall linear both;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-30px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(110vh) rotate(800deg); opacity: 0.2; }
    }
    /* Detail panel */
    #detailBackdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.48);
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity 0.22s;
    }
    #detailBackdrop.open { opacity: 1; pointer-events: auto; }
    #detailPanel {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%) scale(0.93);
      width: min(92vw, 480px); max-height: 85vh;
      background: #fff; border-radius: 20px;
      padding: 1.2rem 1.2rem 1.5rem;
      z-index: 201; overflow-y: auto;
      opacity: 0; pointer-events: none;
      transition: opacity 0.22s, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-overflow-scrolling: touch;
    }
    #detailPanel.open {
      opacity: 1; pointer-events: auto;
      transform: translate(-50%, -50%) scale(1);
    }
    .detail-handle { display: none; }
    .detail-head {
      display: flex; gap: 1rem; align-items: flex-start;
      margin-bottom: 1rem; position: relative;
    }
    .detail-img-wrap {
      width: 100px; height: 100px; flex-shrink: 0;
      background: var(--cream); border-radius: var(--radius-card);
      display: flex; align-items: center; justify-content: center;
    }
    .detail-img { width: 88px; height: 88px; object-fit: contain; image-rendering: pixelated; }
    .detail-head-info { flex: 1; min-width: 0; padding-top: 0.1rem; }
    .detail-avail { font-size: 0.78rem; font-weight: 700; color: #15803d; margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.3rem; }
    .detail-avail.month { color: var(--text-muted); }
    .detail-avail.unavail { color: var(--text-faint); }
    .detail-name { font-size: 1.22rem; font-weight: 800; color: var(--text-main); line-height: 1.2; }
    .detail-price { font-size: 0.82rem; color: var(--text-muted); margin-top: 0.4rem; }
    .detail-close-btn {
      position: absolute; top: 0; right: 0;
      width: 38px; height: 38px; border-radius: 50%;
      background: #efefef; border: none; font-size: 1rem;
      cursor: pointer; color: var(--text-main); display: flex;
      align-items: center; justify-content: center; flex-shrink: 0;
      transition: background 0.15s; font-weight: 700;
    }
    .detail-close-btn:hover { background: #e0e0e0; }
    .detail-rows { display: flex; flex-direction: column; gap: 0.55rem; margin-bottom: 1rem; }
    .detail-row {
      display: flex; align-items: baseline; gap: 0.5rem;
      font-size: 0.92rem; color: var(--text-main);
    }
    .detail-row-icon { flex-shrink: 0; }
    .detail-section-label {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-faint); margin-bottom: 0.45rem;
    }
    .detail-months-wrap { margin-bottom: 1.1rem; }
    .detail-months { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .month-badge {
      padding: 0.22rem 0.5rem; border-radius: 20px; font-size: 0.72rem; font-weight: 700;
      background: #f0f0f0; color: var(--text-faint);
    }
    .month-badge.active { background: #dcfce7; color: #15803d; }
    .month-badge.current { background: #16a34a; color: #fff; }
    .detail-checks { display: flex; gap: 0.65rem; }
    /* Loading overlay */
    #loadingOverlay {
      position: fixed; inset: 0; background: rgba(46,107,40,0.9);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; flex-direction: column; gap: 0.6rem;
      color: #d8f5d8; font-size: 1.05rem; font-weight: 700;
    }
    .overlay-leaf { font-size: 2.2rem; animation: sway 1.5s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-12deg); } to { transform: rotate(12deg); } }
    /* Export button */
    .export-btn {
      background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 20px; color: rgba(255,255,255,0.85); font-size: 0.7rem; font-weight: 700;
      padding: 0.2rem 0.6rem; cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .export-btn:hover { background: rgba(255,255,255,0.28); color: #fff; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-top">
    <div>
      <div class="header-title">🌿 Animal Crossing: GC</div>
      <div class="header-subtitle">Collection Tracker</div>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
  <div class="header-progress">
    <div class="progress-item">
      <span class="progress-label">🦋 Bugs</span>
      <div class="progress-track"><div class="progress-fill" id="progressBugs"></div></div>
      <span class="progress-count" id="progressBugsLabel">0/40</span>
    </div>
    <div class="progress-item">
      <span class="progress-label">🐟 Fish</span>
      <div class="progress-track"><div class="progress-fill fish" id="progressFish"></div></div>
      <span class="progress-count" id="progressFishLabel">0/40</span>
    </div>
    <div class="progress-item">
      <span class="progress-label">🦕 Fossils</span>
      <div class="progress-track"><div class="progress-fill fossils" id="progressFossils"></div></div>
      <span class="progress-count" id="progressFossilsLabel">0/25</span>
    </div>
    <div class="progress-item">
      <span class="progress-label">🏛️ Total</span>
      <div class="progress-track"><div class="progress-fill total" id="progressTotal"></div></div>
      <span class="progress-count" id="progressTotalLabel">0/105</span>
    </div>
  </div>
  <div class="header-dt">
    <span class="dt-label">📅</span>
    <input class="dt-input" type="date" id="dtDate" autocomplete="off">
    <input class="dt-input" type="time" id="dtTime" autocomplete="off">
    <button class="dt-now-btn" id="dtNow">Now</button>
  </div>
  <div class="header-filters">
    <button class="filter-btn" id="filterNow">🟢 Catchable Now</button>
    <button class="filter-btn" id="filterHide">Hide Unavailable</button>
    <button class="export-btn" id="exportBtn">⬇️ Backup</button>
  </div>
  <div class="header-controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="search" id="searchInput" placeholder="Search…" autocomplete="off">
    </div>
    <div class="sort-wrap" id="sortControls">
      <span class="sort-label">Sort:</span>
      <select class="sort-select" id="sortSelect">
        <option value="num"># Order</option>
        <option value="name">Name A–Z</option>
        <option value="bells">Bells ↓</option>
      </select>
    </div>
  </div>
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="bugs">🦋 Bugs</button>
    <button class="tab-btn"        data-tab="fish">🐟 Fish</button>
    <button class="tab-btn"        data-tab="fossils">🦕 Fossils</button>
  </nav>
</header>

<main>
  <section id="tab-bugs"    class="tab-section active"><div class="card-grid" id="bugGrid"></div></section>
  <section id="tab-fish"    class="tab-section"><div class="card-grid" id="fishGrid"></div></section>
  <section id="tab-fossils" class="tab-section"><div class="fossil-section" id="fossilSection"></div></section>
</main>

<div id="celebrationOverlay">
  <div class="celebration-confetti" id="celebrationConfetti"></div>
  <div class="celebration-card">
    <div class="celebration-emoji">🏛️</div>
    <div class="celebration-title">Museum Complete!</div>
    <div class="celebration-sub">All 105 items donated — Blathers is absolutely astounded!</div>
    <button class="celebration-btn" id="celebrationClose">Amazing!</button>
  </div>
</div>

<div id="detailBackdrop"></div>
<div id="detailPanel" role="dialog" aria-modal="true">
  <div class="detail-handle"></div>
  <div class="detail-head">
    <div class="detail-img-wrap">
      <img id="detailImg" src="" alt="" class="detail-img">
    </div>
    <div class="detail-head-info">
      <div class="detail-avail" id="detailAvail"></div>
      <div class="detail-name" id="detailName"></div>
      <div class="detail-price" id="detailPrice"></div>
    </div>
    <button class="detail-close-btn" id="detailClose" aria-label="Close">✕</button>
  </div>
  <div class="detail-rows" id="detailRows"></div>
  <div class="detail-months-wrap" id="detailMonthsWrap">
    <div class="detail-section-label">Available months</div>

// ── Availability logic ──────────────────────────────────────────────────────
// Returns 'now' | 'month' | 'none'
function getAvailability(item) {
  if (!item.months) return 'now'; // fossils — always available

  const dateVal = document.getElementById('dtDate').value;
  const timeVal = document.getElementById('dtTime').value;
  if (!dateVal || !timeVal) return 'now';

  const dt = new Date(dateVal + 'T' + timeVal);
  const month = dt.getMonth() + 1; // 1-indexed
  const hour  = dt.getHours();
  const min   = dt.getMinutes();
  const totalMin = hour * 60 + min;

  const inMonth = item.months.includes(month);
  if (!inMonth) return 'none';

  // Parse time window
  const t = item.time;
  if (!t || t === 'All day') return 'now';

  // Parse "H AM/PM – H AM/PM" or "H PM – H AM" style
  function toMinutes(str) {
    str = str.trim();
    const m = str.match(/^(\d+)(?::(\d+))? (AM|PM)$/i);
    if (!m) return null;
    let h = parseInt(m[1]);
    const mins = m[2] ? parseInt(m[2]) : 0;
    const ampm = m[3].toUpperCase();
    if (ampm === 'PM' && h !== 12) h += 12;
    if (ampm === 'AM' && h === 12) h = 0;
    return h * 60 + mins;
  }

  const parts = t.split('–').map(s => s.trim());
  if (parts.length !== 2) return 'now';
  const start = toMinutes(parts[0]);
  const end   = toMinutes(parts[1]);
  if (start === null || end === null) return 'now';

  let inTime;
  if (start <= end) {
    // Same-day window e.g. 8 AM – 5 PM
    inTime = totalMin >= start && totalMin < end;
  } else {
    // Overnight window e.g. 5 PM – 8 AM
    inTime = totalMin >= start || totalMin < end;
  }
  return inTime ? 'now' : 'month';
}

// ── Card builder (shared by all tabs) ──────────────────────────────────────
function buildCard(item, idx, stateArr, onUpdate, opts = {}) {
  const s = stateArr[idx];
  const card = document.createElement('div');
  card.dataset.idx = idx;
  if (opts.type) card.dataset.type = opts.type;
  if (opts.cat)  card.dataset.cat  = opts.cat;
  card.className = 'item-card' + (s.donated ? ' is-donated' : s.found ? ' is-found' : '');

  let locationHTML = '';
  if (item.location) {
    if (item.shadow) {
      locationHTML = `<div class="meta-row"><span class="shadow-dots" title="${SHADOW_LABEL[item.shadow]} shadow">${SHADOW_DOTS[item.shadow]}</span>${SHADOW_LABEL[item.shadow]} shadow · ${item.location}</div>`;
    } else {
      locationHTML = `<div class="meta-row">📍 ${item.location}</div>`;
    }
  }
  const timeHTML = item.time ? `<div class="meta-row">🕐 ${item.time}</div>` : '';
  const numHTML  = opts.number != null ? `<span class="card-num">#${opts.number}</span>` : '';

  // Availability indicator (bugs & fish only)
  let availHTML = '';
  if (item.months) {
    const av = getAvailability(item);
    if (av === 'now') {
      availHTML = `<div class="card-avail"><span class="avail-dot"></span>Catchable now</div>`;
    } else if (av === 'month') {
      availHTML = `<div class="card-avail month"><span class="avail-clock">🕐</span>In season, wrong time</div>`;
    }
    // 'none' → no indicator; card gets dimmed via class
  }

  card.innerHTML = `
    <div class="card-top">
      <div class="card-img-wrap">
        <img class="card-img" src="${item.img}" alt="${item.name}" onerror="this.style.opacity='0.25'">
      </div>
      <div class="card-info">
        ${availHTML}
        <div class="card-name">${numHTML}${item.name}</div>
        <div class="card-meta">${locationHTML}${timeHTML}<div class="meta-row">🔔 ${item.price.toLocaleString()} bells</div></div>
      </div>
    </div>
    <div class="card-checks">
      <label class="check-pill found-pill ${s.found ? 'is-checked' : ''}"><input type="checkbox" ${s.found ? 'checked' : ''}> Found</label>
      <label class="check-pill donated-pill ${s.donated ? 'is-checked' : ''}"><input type="checkbox" ${s.donated ? 'checked' : ''}> Donated</label>
    </div>`;

  const foundCb = card.querySelectorAll('input')[0];
  const donatedCb = card.querySelectorAll('input')[1];
  const foundPill = card.querySelector('.found-pill');
  const donatedPill = card.querySelector('.donated-pill');

  function sync() {
    s.found = foundCb.checked; s.donated = donatedCb.checked;
    foundPill.classList.toggle('is-checked', s.found);
    donatedPill.classList.toggle('is-checked', s.donated);
    card.classList.toggle('is-found',   s.found && !s.donated);
    card.classList.toggle('is-donated', s.donated);
    onUpdate();
    writeToFirebase();
    applyFilters();
  }
  foundCb.addEventListener('change', () => { if (!foundCb.checked) donatedCb.checked = false; sync(); });
  donatedCb.addEventListener('change', () => { if (donatedCb.checked) foundCb.checked = true; sync(); });

  // Tap card body → open detail panel (ignore taps on the checkbox area)
  card.addEventListener('click', e => {
    if (e.target.closest('.card-checks')) return;
    if (card.dataset.cat) openDetail(card.dataset.cat, parseInt(card.dataset.idx, 10));
  });

  return card;
}

    `<span class="stat-chip">🏛️ ${totalDon}/${total}</span>`;

  const pct = (n, d) => d ? `${(n / d * 100).toFixed(1)}%` : '0%';
  document.getElementById('progressBugs').style.width    = pct(bd, BUGS.length);
  document.getElementById('progressFish').style.width    = pct(fd, FISH.length);
  document.getElementById('progressFossils').style.width = pct(od, FOSSILS.length);
  document.getElementById('progressTotal').style.width   = pct(totalDon, total);
  document.getElementById('progressBugsLabel').textContent    = `${bd}/${BUGS.length}`;
  document.getElementById('progressFishLabel').textContent    = `${fd}/${FISH.length}`;
  document.getElementById('progressFossilsLabel').textContent = `${od}/${FOSSILS.length}`;
  document.getElementById('progressTotalLabel').textContent   = `${totalDon}/${total}`;
}

// ── Apply filters & availability refresh ────────────────────────────────────
function applyFilters() {
  // Bugs
  const bugTerm = searchTerms.bugs.toLowerCase();
  document.querySelectorAll('#bugGrid .item-card').forEach(card => {
    const i    = parseInt(card.dataset.idx, 10);
    const item = BUGS[i];
    const s    = state.bugs[i];
    const av   = getAvailability(item);
    // refresh availability indicator
    const info = card.querySelector('.card-info');
    const oldAv = info.querySelector('.card-avail');
    if (oldAv) oldAv.remove();
    if (av === 'now') {
      info.insertAdjacentHTML('afterbegin', `<div class="card-avail"><span class="avail-dot"></span>Catchable now</div>`);
    } else if (av === 'month') {
      info.insertAdjacentHTML('afterbegin', `<div class="card-avail month"><span class="avail-clock">🕐</span>In season, wrong time</div>`);
    }
    card.classList.toggle('unavail', av === 'none');
    // visibility
    let hide = false;
    if (filterNowActive  && (av !== 'now' || s.donated)) hide = true;
    if (filterHideActive && av === 'none') hide = true;
    if (bugTerm && !item.name.toLowerCase().includes(bugTerm)) hide = true;
    card.style.display = hide ? 'none' : '';
  });

  // Fish
  const fishTerm = searchTerms.fish.toLowerCase();
  document.querySelectorAll('#fishGrid .item-card').forEach(card => {
    const i    = parseInt(card.dataset.idx, 10);
    const item = FISH[i];
    const s    = state.fish[i];
    const av   = getAvailability(item);
    const info = card.querySelector('.card-info');
    const oldAv = info.querySelector('.card-avail');
    if (oldAv) oldAv.remove();
    if (av === 'now') {
      info.insertAdjacentHTML('afterbegin', `<div class="card-avail"><span class="avail-dot"></span>Catchable now</div>`);
    } else if (av === 'month') {
      info.insertAdjacentHTML('afterbegin', `<div class="card-avail month"><span class="avail-clock">🕐</span>In season, wrong time</div>`);
    }
    card.classList.toggle('unavail', av === 'none');
    let hide = false;
    if (filterNowActive  && (av !== 'now' || s.donated)) hide = true;
    if (filterHideActive && av === 'none') hide = true;
    if (fishTerm && !item.name.toLowerCase().includes(fishTerm)) hide = true;
    card.style.display = hide ? 'none' : '';
  });

  // Fossils — search only (no availability filter)
  const fossilTerm = searchTerms.fossils.toLowerCase();
  if (fossilTerm) {
    document.querySelectorAll('#fossilSection .item-card').forEach(card => {
      const i    = parseInt(card.dataset.idx, 10);
      const item = FOSSILS[i];
      card.style.display = item.name.toLowerCase().includes(fossilTerm) ? '' : 'none';
    });
  } else {
    document.querySelectorAll('#fossilSection .item-card').forEach(card => { card.style.display = ''; });
  }
}

function getSortedIndices(arr, key) {
  const indices = arr.map((_, i) => i);
  if      (key === 'name')   indices.sort((a, b) => arr[a].name.localeCompare(arr[b].name));
  else if (key === 'bells')  indices.sort((a, b) => arr[b].price - arr[a].price);
  else if (key === 'shadow') indices.sort((a, b) => (arr[a].shadow || 0) - (arr[b].shadow || 0));
  // 'num' → original order, no sort needed
  return indices;
}

function renderBugGrid() {
  bugGrid.innerHTML = '';
  getSortedIndices(BUGS, sortState.bugs).forEach(idx =>
    bugGrid.appendChild(buildCard(BUGS[idx], idx, state.bugs, updateHeaderStats, { number: idx+1, type: 'bug', cat: 'bugs' }))
  );
}

function renderFishGrid() {
  fishGrid.innerHTML = '';
  getSortedIndices(FISH, sortState.fish).forEach(idx =>
    fishGrid.appendChild(buildCard(FISH[idx], idx, state.fish, updateHeaderStats, { number: idx+1, type: 'fish', cat: 'fish' }))
  );
}

function updateSortControls(tab) {
  const wrap = document.getElementById('sortControls');
  const sel  = document.getElementById('sortSelect');
  if (tab === 'fossils') { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const opts = [
    { value: 'num',   label: '# Order'   },
    { value: 'name',  label: 'Name A–Z'  },
    { value: 'bells', label: 'Bells ↓'   },
  ];
  if (tab === 'fish') opts.push({ value: 'shadow', label: 'Shadow Size' });
  sel.innerHTML = opts.map(o =>
    `<option value="${o.value}"${sortState[tab] === o.value ? ' selected' : ''}>${o.label}</option>`
  ).join('');
}

// ── Bug grid ───────────────────────────────────────────────────────────────
renderBugGrid();

// ── Fish grid ──────────────────────────────────────────────────────────────
renderFishGrid();

// ── Fossil section (grouped) ───────────────────────────────────────────────
const GROUP_ORDER = ['Triceratops','Tyrannosaurus','Apatosaurus','Stegosaurus','Pteranodon','Plesiosaur','Mammoth'];

function renderFossilSection() {
  const container = document.getElementById('fossilSection');
  const groupMap = {}; const standalones = [];
  FOSSILS.forEach((fossil, idx) => {
    if (fossil.group) { (groupMap[fossil.group] = groupMap[fossil.group] || []).push({ fossil, idx }); }
    else              { standalones.push({ fossil, idx }); }
  });

  function renderGroup(label, items) {
    const section = document.createElement('div');
    section.className = 'fossil-group';
    const header = document.createElement('div');
    header.className = 'group-header';
    const nameEl = document.createElement('span');
    nameEl.className = 'group-name'; nameEl.textContent = label;
    const badge = document.createElement('span');
    badge.className = 'group-badge';
    function refreshBadge() {
      const donated = items.filter(({idx}) => state.fossils[idx].donated).length;
      badge.textContent = `${donated}/${items.length} donated`;
      badge.classList.toggle('complete', donated === items.length);
    }
    refreshBadge();
    fossilBadgeRefreshers.push(refreshBadge);
    header.appendChild(nameEl); header.appendChild(badge); section.appendChild(header);
    const grid = document.createElement('div');
    grid.className = 'card-grid';
    items.forEach(({fossil, idx}) => {
      grid.appendChild(buildCard(fossil, idx, state.fossils, () => { refreshBadge(); updateHeaderStats(); }, { cat: 'fossils' }));
    });
    section.appendChild(grid); container.appendChild(section);
  }

  GROUP_ORDER.forEach(name => { if (groupMap[name]) renderGroup(name, groupMap[name]); });
  if (standalones.length) renderGroup('Standalone Fossils', standalones);
}

renderFossilSection();
updateHeaderStats();
applyFilters();
updateSortControls('bugs');
// ── Firebase helpers ────────────────────────────────────────────────────────
function applyCardState(card, s) {
  const foundCb   = card.querySelectorAll('input')[0];
  const donatedCb = card.querySelectorAll('input')[1];
  const foundPill   = card.querySelector('.found-pill');
  const donatedPill = card.querySelector('.donated-pill');
  foundCb.checked   = s.found;
  donatedCb.checked = s.donated;
  foundPill.classList.toggle('is-checked',   s.found);
  donatedPill.classList.toggle('is-checked', s.donated);
  card.classList.toggle('is-found',   s.found && !s.donated);
  card.classList.toggle('is-donated', s.donated);
}

function refreshAllCardUIs() {
  document.querySelectorAll('#bugGrid .item-card').forEach(card => {
    const i = parseInt(card.dataset.idx, 10);
    if (!isNaN(i) && state.bugs[i]) applyCardState(card, state.bugs[i]);
  });
  document.querySelectorAll('#fishGrid .item-card').forEach(card => {
    const i = parseInt(card.dataset.idx, 10);
    if (!isNaN(i) && state.fish[i]) applyCardState(card, state.fish[i]);
  });
  document.querySelectorAll('#fossilSection .item-card').forEach(card => {
    const i = parseInt(card.dataset.idx, 10);
    if (!isNaN(i) && state.fossils[i]) applyCardState(card, state.fossils[i]);
  });
  fossilBadgeRefreshers.forEach(fn => fn());
  updateHeaderStats();
  applyFilters();
}

// ── Firebase onValue listener ────────────────────────────────────────────────
onValue(_ref, (snapshot) => {
  const data = snapshot.val();
  if (data) {
    ['bugs', 'fish', 'fossils'].forEach(cat => {
      if (Array.isArray(data[cat])) {
        data[cat].forEach((item, i) => {
          if (state[cat][i]) {
            state[cat][i].found   = !!item.found;
            state[cat][i].donated = !!item.donated;
          }
        });
      }
    });
    refreshAllCardUIs();
  }
  _fbReady = true;
  const overlay = document.getElementById('loadingOverlay');
  if (overlay) overlay.remove();
});

// ── Detail panel ─────────────────────────────────────────────────────────────
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
let detailCat = null;
let detailIdx = null;

function itemForDetail() {
  if (detailCat === 'bugs')    return BUGS[detailIdx];
  if (detailCat === 'fish')    return FISH[detailIdx];
  if (detailCat === 'fossils') return FOSSILS[detailIdx];
}

function openDetail(cat, idx) {
  detailCat = cat; detailIdx = idx;
  const item = itemForDetail();
  const s    = state[cat][idx];

  // Image & name
  document.getElementById('detailImg').src = item.img;
  document.getElementById('detailImg').alt = item.name;
  document.getElementById('detailName').textContent = item.name;

  // Price (secondary)
  document.getElementById('detailPrice').textContent = `🔔 ${item.price.toLocaleString()} bells`;

  // Availability indicator
  const avEl = document.getElementById('detailAvail');
  if (item.months) {
    const av = getAvailability(item);
    if (av === 'now') {
      avEl.className = 'detail-avail';
      avEl.innerHTML = `<span class="avail-dot"></span> Catchable now`;
    } else if (av === 'month') {
      avEl.className = 'detail-avail month';
      avEl.innerHTML = `🕐 In season, wrong time`;
    } else {
      avEl.className = 'detail-avail unavail';
      avEl.innerHTML = `Out of season`;
    }
  } else {
    avEl.className = ''; avEl.innerHTML = '';
  }

  // Info rows (location + time)
  const rows = [];
  if (item.location) rows.push(`<div class="detail-row"><span class="detail-row-icon">📍</span>${item.location}</div>`);
  if (item.time)     rows.push(`<div class="detail-row"><span class="detail-row-icon">🕐</span>${item.time}</div>`);
  document.getElementById('detailRows').innerHTML = rows.join('');

  // Month badges
  const monthsWrap = document.getElementById('detailMonthsWrap');
  if (item.months) {
    const dt       = new Date(document.getElementById('dtDate').value + 'T' + document.getElementById('dtTime').value);
    const curMonth = dt.getMonth() + 1;
    document.getElementById('detailMonths').innerHTML = MONTH_NAMES.map((m, i) => {
      const mo = i + 1;
      const inSeason = item.months.includes(mo);
      const isCur    = mo === curMonth;
      const cls      = isCur && inSeason ? 'month-badge current' : inSeason ? 'month-badge active' : 'month-badge';
      return `<span class="${cls}">${m}</span>`;
    }).join('');
    monthsWrap.style.display = '';
  } else {
    monthsWrap.style.display = 'none';
  }

  // Sync found/donated pills
  syncDetailPills();

  // Show
  document.getElementById('detailBackdrop').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
}

function syncDetailPills() {
  if (detailCat === null) return;
  const s         = state[detailCat][detailIdx];
  const foundPill = document.getElementById('detailFoundPill');
  const donPill   = document.getElementById('detailDonatedPill');
  const foundCb   = document.getElementById('detailFoundCb');
  const donCb     = document.getElementById('detailDonatedCb');
  foundCb.checked = s.found;   foundPill.classList.toggle('is-checked', s.found);
  donCb.checked   = s.donated; donPill.classList.toggle('is-checked',  s.donated);
}

function closeDetail() {
  document.getElementById('detailBackdrop').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
}

// Sync the card DOM for the currently-open detail item
function syncDetailCard() {
  if (detailCat === null) return;
  const gridId = detailCat === 'bugs' ? '#bugGrid' : detailCat === 'fish' ? '#fishGrid' : '#fossilSection';
  const card = document.querySelector(`${gridId} .item-card[data-idx="${detailIdx}"]`);
  if (card) applyCardState(card, state[detailCat][detailIdx]);
}

// Panel checkbox handlers
document.getElementById('detailFoundCb').addEventListener('change', function() {
  if (!this.checked) document.getElementById('detailDonatedCb').checked = false;
  const s = state[detailCat][detailIdx];
  s.found   = this.checked;
  s.donated = document.getElementById('detailDonatedCb').checked;
  syncDetailPills();
  syncDetailCard();
  updateHeaderStats();
  applyFilters();
  writeToFirebase();
});
document.getElementById('detailDonatedCb').addEventListener('change', function() {
  if (this.checked) document.getElementById('detailFoundCb').checked = true;
  const s = state[detailCat][detailIdx];
  s.found   = document.getElementById('detailFoundCb').checked;
  s.donated = this.checked;
  syncDetailPills();
  syncDetailCard();
  updateHeaderStats();
  applyFilters();
  writeToFirebase();
});

// Close handlers
document.getElementById('detailClose').addEventListener('click', closeDetail);
document.getElementById('detailBackdrop').addEventListener('click', closeDetail);

// ── Completion celebration ─────────────────────────────────────────────────────
let celebrationShown = false;
const CONFETTI_COLORS = ['#22c55e','#38bdf8','#fb923c','#a78bfa','#fbbf24','#f43f5e','#34d399'];

function checkCompletion() {
  if (celebrationShown) return;
  if (!_fbReady) return;
  const bd = state.bugs.filter(s => s.donated).length;
  const fd = state.fish.filter(s => s.donated).length;
  const od = state.fossils.filter(s => s.donated).length;
  if (bd < BUGS.length || fd < FISH.length || od < FOSSILS.length) return;
  celebrationShown = true;
  launchCelebration();
}

function launchCelebration() {
  const container = document.getElementById('celebrationConfetti');
  container.innerHTML = '';
  for (let i = 0; i < 48; i++) {
    const el = document.createElement('span');
    el.className = 'confetti-piece';
    el.style.left             = (Math.random() * 100) + '%';
    el.style.top              = '0';
    el.style.background       = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    el.style.animationDuration = (1.8 + Math.random() * 2.4) + 's';
    el.style.animationDelay   = (Math.random() * 1.5) + 's';
    el.style.width            = (7 + Math.random() * 7) + 'px';
    el.style.height           = (7 + Math.random() * 7) + 'px';
    container.appendChild(el);
  }
  document.getElementById('celebrationOverlay').classList.add('open');
}

document.getElementById('celebrationClose').addEventListener('click', () => {
  document.getElementById('celebrationOverlay').classList.remove('open');
});

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerms[activeTab] = e.target.value;
  applyFilters();
});

// ── Sort ──────────────────────────────────────────────────────────────────────
document.getElementById('sortSelect').addEventListener('change', e => {
  sortState[activeTab] = e.target.value;
  if      (activeTab === 'bugs') renderBugGrid();
  else if (activeTab === 'fish') renderFishGrid();
  applyFilters();
});

// ── JSON export ──────────────────────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  const d = new Date();
  const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const payload = {
    exportDate: d.toISOString(),
    bugs:    state.bugs.map((s, i) => ({ name: BUGS[i].name, ...s })),
    fish:    state.fish.map((s, i) => ({ name: FISH[i].name, ...s })),
    fossils: state.fossils.map((s, i) => ({ name: FOSSILS[i].name, ...s })),
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `acgc-backup-${dateStr}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
});

</script>
